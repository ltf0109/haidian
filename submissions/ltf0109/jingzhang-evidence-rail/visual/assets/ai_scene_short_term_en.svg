    <text x="104" y="582" font-size="15" font-weight="bold" fill="#101827">Anonymous sensing counts</text>
    <text x="104" y="604" fill="#162033">Aggregate counts only, no personal tracks;</text>
    <text x="104" y="622" fill="#162033">processed locally at edge node; data</text>
    <text x="104" y="640" fill="#162033">minimized, auditable.</text>
    <!-- 2 -->
