    <rect x="40" y="688" width="8" height="126" rx="4" fill="#0d47a1"/>
    <circle cx="78" cy="726" r="15" fill="#0d47a1"/><text x="78" y="731" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <text x="104" y="722" font-size="15" font-weight="bold" fill="#101827">Community kiosk</text>
    <text x="104" y="744" fill="#162033">No account / paper window; audit</text>
    <text x="104" y="762" fill="#162033">results visualized; residents query &amp;</text>
    <text x="104" y="780" fill="#162033">deliberate; transparent, traceable.</text>
    <!-- 5 -->
    <rect x="453" y="688" width="367" height="126" rx="6" fill="#ffffff" stroke="#cfd6df"/>
    <rect x="453" y="688" width="8" height="126" rx="4" fill="#74c476"/>
    <circle cx="491" cy="726" r="15" fill="#74c476"/><text x="491" y="731" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
    <text x="517" y="722" font-size="15" font-weight="bold" fill="#101827">Open-space co-decision</text>
    <text x="517" y="744" fill="#162033">Residents / merchants / accessibility</text>
    <text x="517" y="762" fill="#162033">users co-decide open-space uses &amp;</text>
    <text x="517" y="780" fill="#162033">hours; free, low-threshold access.</text>
    <!-- 6 -->
    <rect x="866" y="688" width="367" height="126" rx="6" fill="#ffffff" stroke="#cfd6df"/>
    <rect x="866" y="688" width="8" height="126" rx="4" fill="#d62728"/>
    <circle cx="904" cy="726" r="15" fill="#d62728"/><text x="904" y="731" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
    <text x="930" y="722" font-size="15" font-weight="bold" fill="#101827">Human-review loop</text>
    <text x="930" y="744" fill="#162033">AI proposes, humans decide; process</text>
    <text x="930" y="762" fill="#162033">reversible, adjustable; evidence</text>
    <text x="930" y="780" fill="#162033">tiers, boundary disclosure, self-check.</text>
