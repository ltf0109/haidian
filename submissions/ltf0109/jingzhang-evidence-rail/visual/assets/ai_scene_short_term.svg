<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Heiti SC',sans-serif">
  <!-- ===== background ===== -->
  <rect x="0" y="0" width="1280" height="860" fill="#ffffff"/>

  <!-- ===== title ===== -->
  <text x="40" y="46" font-size="28" font-weight="bold" fill="#101827">京张 AI 创新带 · AI 场景示意图</text>
  <text x="40" y="74" font-size="15" fill="#475467">AI Scene Illustration · 近5年（试点先行 · 可逆 · 人工复核） · AI 作为效率工具与城市生活参与主体</text>

  <!-- ===== scene frame ===== -->
  <rect x="32" y="92" width="1216" height="438" fill="#f7f9fb" stroke="#cfd6df" stroke-width="1"/>

  <!-- == LEFT building: 科研/产业 4层 + 底层商业 == -->
  <rect x="48" y="120" width="290" height="335" fill="#aed4f0" stroke="#5b8fb0" stroke-width="1.5"/>
  <g stroke="#ffffff" stroke-width="2" opacity="0.7">
    <line x1="112" y1="120" x2="112" y2="372"/><line x1="176" y1="120" x2="176" y2="372"/>
    <line x1="240" y1="120" x2="240" y2="372"/><line x1="304" y1="120" x2="304" y2="372"/>
    <line x1="48" y1="204" x2="338" y2="204"/><line x1="48" y1="288" x2="338" y2="288"/>
  </g>
  <rect x="48" y="372" width="290" height="83" fill="#f6c177" stroke="#5b8fb0" stroke-width="1.5"/>
  <rect x="56" y="392" width="228" height="6" fill="#d98c5f"/>
  <g fill="#5d4037" opacity="0.85">
    <rect x="64" y="406" width="44" height="34"/><rect x="150" y="406" width="44" height="34"/><rect x="236" y="406" width="44" height="34"/>
  </g>
  <text x="193" y="452" font-size="11" font-weight="bold" fill="#5d4037" text-anchor="middle">底层商业 · 首层活化</text>
  <text x="193" y="110" font-size="14" font-weight="bold" fill="#5b8fb0" text-anchor="middle">科研 / 产业界面</text>
  <text x="193" y="140" font-size="10" fill="#0d47a1" text-anchor="middle">AI 原点 · 培育 / 孵化</text>

  <!-- == RIGHT building: 居住 + 底层商业 == -->
  <rect x="942" y="120" width="290" height="335" fill="#ffd24a" stroke="#c9a227" stroke-width="1.5"/>
  <g stroke="#ffffff" stroke-width="2" opacity="0.7">
    <line x1="1006" y1="120" x2="1006" y2="372"/><line x1="1070" y1="120" x2="1070" y2="372"/>
    <line x1="1134" y1="120" x2="1134" y2="372"/><line x1="1198" y1="120" x2="1198" y2="372"/>
    <line x1="942" y1="170" x2="1232" y2="170"/><line x1="942" y1="220" x2="1232" y2="220"/>
    <line x1="942" y1="271" x2="1232" y2="271"/><line x1="942" y1="321" x2="1232" y2="321"/>
  </g>
  <rect x="942" y="372" width="290" height="83" fill="#f6c177" stroke="#c9a227" stroke-width="1.5"/>
  <rect x="950" y="392" width="228" height="6" fill="#d98c5f"/>
  <g fill="#5d4037" opacity="0.85">
    <rect x="958" y="406" width="44" height="34"/><rect x="1044" y="406" width="44" height="34"/><rect x="1130" y="406" width="44" height="34"/>
  </g>
  <text x="1087" y="452" font-size="11" font-weight="bold" fill="#5d4037" text-anchor="middle">底层商业 · 首层活化</text>
  <text x="1087" y="110" font-size="14" font-weight="bold" fill="#a07d00" text-anchor="middle">居住界面</text>

  <!-- == street section band == -->
  <rect x="338" y="488" width="604" height="24" fill="#cfcfcf"/>
  <!-- bike lane (orange) -->
  <rect x="438" y="488" width="66" height="24" fill="#fb8c00"/>
  <!-- green belt median (trees) -->
  <rect x="504" y="488" width="62" height="24" fill="#bfe3c0"/>
  <!-- vehicle lane (gray) -->
  <rect x="566" y="488" width="302" height="24" fill="#b8b8b8"/>
  <line x1="566" y1="500" x2="868" y2="500" stroke="#ffd24a" stroke-width="2" stroke-dasharray="10 8"/>
  <!-- far walkway (raised, 留白公共空间) -->
  <rect x="338" y="455" width="100" height="23" fill="#d8efe0" stroke="#9cccaf" stroke-width="1"/>
  <rect x="338" y="478" width="100" height="10" fill="#9e9e9e"/>
  <!-- near walkway (raised, 留白公共空间) -->
  <rect x="868" y="455" width="74" height="23" fill="#d8efe0" stroke="#9cccaf" stroke-width="1"/>
  <rect x="868" y="478" width="74" height="10" fill="#9e9e9e"/>
  <line x1="338" y1="512" x2="942" y2="512" stroke="#2b2b2b" stroke-width="1.5"/>

  <!-- trees in green belt -->
  <g>
    <rect x="520" y="452" width="4" height="36" fill="#8d6e63"/><circle cx="522" cy="440" r="16" fill="#4caf50"/><circle cx="528" cy="444" r="11" fill="#66bb6a"/>
    <rect x="540" y="452" width="4" height="36" fill="#8d6e63"/><circle cx="542" cy="440" r="16" fill="#4caf50"/><circle cx="548" cy="444" r="11" fill="#66bb6a"/>
    <rect x="558" y="452" width="4" height="36" fill="#8d6e63"/><circle cx="560" cy="440" r="16" fill="#4caf50"/><circle cx="566" cy="444" r="11" fill="#66bb6a"/>
  </g>

  <!-- accessibility ramp on far walkway -->
  <polygon points="420,455 438,455 460,488 420,488" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1"/>
  <circle cx="434" cy="472" r="9" fill="#ffffff" stroke="#37474f" stroke-width="1.2"/>
  <circle cx="434" cy="468" r="3" fill="#37474f"/>
  <path d="M 430,471 l 0,4 l 4,0 M 430,471 a 5,5 0 1 0 4,6" fill="none" stroke="#37474f" stroke-width="1.2"/>
  <text x="458" y="452" font-size="9" font-weight="bold" fill="#37474f">无障碍坡</text>

  <!-- AI sensing pole (left) with edge node + counting arc -->
  <g>
    <rect x="441" y="400" width="6" height="88" fill="#555555"/>
    <rect x="436" y="388" width="16" height="12" rx="2" fill="#17becf"/>
    <circle cx="444" cy="394" r="3" fill="#0d47a1"/>
    <path d="M 428,392 a 7,7 0 0 1 0,8 M 424,390 a 11,11 0 0 1 0,12" fill="none" stroke="#17becf" stroke-width="1.2"/>
    <text x="444" y="384" font-size="9" font-weight="bold" fill="#0d47a1" text-anchor="middle">轻量 AI 感知</text>
    <text x="444" y="406" font-size="8" fill="#0d47a1" text-anchor="middle">边缘节点 · 数据最小化</text>
    <!-- counting arc toward plaza -->
    <path d="M 447,452 a 60,40 0 0 0 -40,40" fill="none" stroke="#17becf" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text x="404" y="500" font-size="9" font-weight="bold" fill="#0d47a1" text-anchor="middle">匿名计数 → 盲区识别</text>
  </g>

  <!-- micro-circulation bus: length 60, 2 windows, door on right -->
  <g>
    <rect x="750" y="444" width="60" height="44" rx="4" fill="#1f77b4"/>
    <g fill="#e3f2fd">
      <rect x="758" y="450" width="16" height="13"/><rect x="780" y="450" width="14" height="13"/>
    </g>
    <circle cx="768" cy="489" r="6" fill="#2b2b2b"/><circle cx="802" cy="489" r="6" fill="#2b2b2b"/>
    <rect x="798" y="452" width="10" height="36" fill="#1565c0"/>
    <circle cx="803" cy="470" r="8" fill="#ffffff" stroke="#1f77b4" stroke-width="1.5"/>
    <circle cx="803" cy="467" r="2.3" fill="#1f77b4"/>
    <path d="M 800,469 l 0,4 l 3,0 M 800,469 a 4,4 0 1 0 3,4.5" fill="none" stroke="#1f77b4" stroke-width="1.2"/>
  </g>
  <rect x="745" y="430" width="70" height="14" rx="2" fill="#ffffff" stroke="#0d47a1" stroke-width="0.8"/>
  <text x="780" y="440" font-size="9" font-weight="bold" fill="#0d47a1" text-anchor="middle">微循环公交</text>

  <!-- public kiosk / community screen (near walkway, right) -->
  <g>
    <rect x="884" y="420" width="54" height="35" rx="3" fill="#0d47a1"/>
    <rect x="892" y="428" width="8" height="20" fill="#ffffff"/><rect x="904" y="432" width="8" height="16" fill="#ffffff"/><rect x="916" y="426" width="8" height="22" fill="#ffffff"/>
    <line x1="911" y1="455" x2="911" y2="472" stroke="#37474f" stroke-width="3"/>
    <text x="911" y="414" font-size="9" font-weight="bold" fill="#0d47a1" text-anchor="middle">社区交互屏</text>
    <text x="911" y="486" font-size="8" fill="#0d47a1" text-anchor="middle">数据可视化 · 无账号</text>
  </g>

  <!-- far walkway plaza: people + table, community co-decision (1/3) -->
  <g>
    <line x1="380" y1="440" x2="380" y2="418" stroke="#6d4c41" stroke-width="2"/>
    <circle cx="380" cy="416" r="20" fill="#ef9a9a" opacity="0.85"/>
    <rect x="364" y="440" width="32" height="4" fill="#6d4c41"/>
    <line x1="366" y1="444" x2="366" y2="458" stroke="#6d4c41" stroke-width="2"/>
    <line x1="394" y1="444" x2="394" y2="458" stroke="#6d4c41" stroke-width="2"/>
    <circle cx="356" cy="433" r="5" fill="#37474f"/><rect x="353" y="437" width="6" height="13" rx="2" fill="#37474f"/>
    <rect x="353" y="450" width="2.5" height="5" fill="#37474f"/><rect x="356.5" y="450" width="2.5" height="5" fill="#37474f"/>
    <circle cx="404" cy="433" r="5" fill="#37474f"/><rect x="401" y="437" width="6" height="13" rx="2" fill="#37474f"/>
    <rect x="401" y="450" width="2.5" height="5" fill="#37474f"/><rect x="404.5" y="450" width="2.5" height="5" fill="#37474f"/>
    <circle cx="348" cy="420" r="10" fill="#2ca02c"/><text x="348" y="424" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <circle cx="412" cy="420" r="10" fill="#74c476"/><text x="412" y="424" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  </g>
  <text x="388" y="510" font-size="9" fill="#2e7d32" text-anchor="middle">留白公共空间 · 社区共决</text>

  <!-- AI element legend (sky) -->
  <g font-size="11" fill="#475467">
    <rect x="600" y="130" width="14" height="14" fill="#17becf"/><text x="620" y="142">轻量 AI 感知（边缘节点）</text>
    <rect x="600" y="150" width="14" height="14" fill="#1f77b4"/><text x="620" y="162">微循环公交 + 无障碍</text>
    <rect x="600" y="170" width="14" height="14" fill="#0d47a1"/><text x="620" y="182">社区交互屏</text>
    <rect x="600" y="190" width="14" height="14" fill="#d8efe0"/><text x="620" y="202">留白公共空间（社区共决）</text>
  </g>
  <!-- AI proposes / human decides banner -->
  <rect x="600" y="225" width="320" height="26" rx="4" fill="#fff3e0" stroke="#fb8c00" stroke-width="1"/>
  <text x="760" y="243" font-size="12" font-weight="bold" fill="#e65100" text-anchor="middle">AI 提议 → 人决策 → 过程可逆</text>

  <!-- ===== AI scenario cards ===== -->
  <g font-size="13">
    <!-- 1 -->
    <rect x="40" y="548" width="367" height="126" rx="6" fill="#ffffff" stroke="#cfd6df"/>
    <rect x="40" y="548" width="8" height="126" rx="4" fill="#17becf"/>
    <circle cx="78" cy="586" r="15" fill="#17becf"/><text x="78" y="591" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
    <text x="104" y="582" font-size="15" font-weight="bold" fill="#101827">匿名感知计数</text>
    <text x="104" y="604" fill="#162033">仅聚合计数，不采集个人轨迹；</text>
    <text x="104" y="622" fill="#162033">边缘节点本地处理，数据</text>
    <text x="104" y="640" fill="#162033">最小化、可审计。</text>
    <!-- 2 -->
    <rect x="453" y="548" width="367" height="126" rx="6" fill="#ffffff" stroke="#cfd6df"/>
    <rect x="453" y="548" width="8" height="126" rx="4" fill="#1f77b4"/>
    <circle cx="491" cy="586" r="15" fill="#1f77b4"/><text x="491" y="591" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
    <text x="517" y="582" font-size="15" font-weight="bold" fill="#101827">盲区识别</text>
    <text x="517" y="604" fill="#162033">步行 / 轨道覆盖审计，定位</text>
    <text x="517" y="622" fill="#162033">800m 盲区与服务缺口，</text>
    <text x="517" y="640" fill="#162033">结果公开、可复核。</text>
    <!-- 3 -->
    <rect x="866" y="548" width="367" height="126" rx="6" fill="#ffffff" stroke="#cfd6df"/>
    <rect x="866" y="548" width="8" height="126" rx="4" fill="#2ca02c"/>
    <circle cx="904" cy="586" r="15" fill="#2ca02c"/><text x="904" y="591" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
    <text x="930" y="582" font-size="15" font-weight="bold" fill="#101827">共享接驳微循环</text>
    <text x="930" y="604" fill="#162033">微循环公交锚定地铁站，</text>
    <text x="930" y="622" fill="#162033">补全盲区接驳，步行优先 +</text>
    <text x="930" y="640" fill="#162033">轨道锚定。</text>
    <!-- 4 -->
    <rect x="40" y="688" width="367" height="126" rx="6" fill="#ffffff" stroke="#cfd6df"/>
    <rect x="40" y="688" width="8" height="126" rx="4" fill="#0d47a1"/>
    <circle cx="78" cy="726" r="15" fill="#0d47a1"/><text x="78" y="731" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
    <text x="104" y="722" font-size="15" font-weight="bold" fill="#101827">社区交互屏</text>
    <text x="104" y="744" fill="#162033">无账号 / 纸面窗口，审计</text>
    <text x="104" y="762" fill="#162033">结果可视化，居民可查可议，</text>
    <text x="104" y="780" fill="#162033">过程透明、可追溯。</text>
    <!-- 5 -->
    <rect x="453" y="688" width="367" height="126" rx="6" fill="#ffffff" stroke="#cfd6df"/>
    <rect x="453" y="688" width="8" height="126" rx="4" fill="#74c476"/>
    <circle cx="491" cy="726" r="15" fill="#74c476"/><text x="491" y="731" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
    <text x="517" y="722" font-size="15" font-weight="bold" fill="#101827">留白空间共决</text>
    <text x="517" y="744" fill="#162033">居民 / 商户 / 无障碍使用者</text>
    <text x="517" y="762" fill="#162033">共决留白空间用途与时段，</text>
    <text x="517" y="780" fill="#162033">免费开放、低门槛参与。</text>
    <!-- 6 -->
    <rect x="866" y="688" width="367" height="126" rx="6" fill="#ffffff" stroke="#cfd6df"/>
    <rect x="866" y="688" width="8" height="126" rx="4" fill="#d62728"/>
    <circle cx="904" cy="726" r="15" fill="#d62728"/><text x="904" y="731" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
    <text x="930" y="722" font-size="15" font-weight="bold" fill="#101827">人工复核闭环</text>
    <text x="930" y="744" fill="#162033">AI 提议、人决策，过程</text>
    <text x="930" y="762" fill="#162033">可逆、可调；证据分级、</text>
    <text x="930" y="780" fill="#162033">边界声明、自检闭环。</text>
  </g>

  <!-- ===== footer ===== -->
  <text x="40" y="842" font-size="13" fill="#475467">EBIP · 循证渐进式参与规划 · AI 作为理性化工具与城市生活参与主体 · 短期场景仅为示意（实际以现场共同设计校准）</text>
</svg>
